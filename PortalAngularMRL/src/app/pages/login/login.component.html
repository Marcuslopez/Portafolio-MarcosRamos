  <div style="max-width:420px;margin:48px auto;">
    <h2>Login</h2>

    <div *ngIf="error" style="color:#b00020;margin:8px 0;">{{ error }}</div>

    <label>Email</label>
    <input [(ngModel)]="email" placeholder="admin@erplite.com" style="width:100%;padding:8px;margin:6px 0 12px;" />

    <label>Password</label>
    <input [(ngModel)]="password" type="password" style="width:100%;padding:8px;margin:6px 0 12px;" />

    <button (click)="onLogin()" [disabled]="loading" style="padding:10px 14px;">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>
  </div>
