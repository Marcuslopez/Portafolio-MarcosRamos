<div style="padding:20px;max-width:1100px;margin:0 auto;">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h2>Productos</h2>
    <button (click)="logout()">Cerrar sesión</button>
  </div>

  <div *ngIf="loading">Cargando...</div>

  <div *ngIf="error" style="color:#b00020;margin:10px 0;">
    {{ error }}
    <button (click)="load()" style="margin-left:10px;">Reintentar</button>
  </div>

  <table *ngIf="!loading && !error" border="1" cellpadding="8" cellspacing="0" style="width:100%;border-collapse:collapse;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>IdCategoria</th>
        <th>Activo</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of items">
        <td>{{ p.idProducto }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.descripcion }}</td>
        <td>{{ p.precio | number:'1.2-2' }}</td>
        <td>{{ p.stock }}</td>
        <td>{{ p.idCategoria }}</td>
        <td>{{ p.activo ? 'Sí' : 'No' }}</td>
      </tr>
    </tbody>
  </table>
</div>
